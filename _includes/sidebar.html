<aside class="sidebar panel reveal">
  <div class="sidebar-profile">
    <div class="sidebar-avatar">
      <img
        src="{{ site.baseurl }}/assets/images/branch-logo-white.svg"
        alt="{{ site.title }}"
        class="sidebar-avatar-img" />
    </div>
    <h1 class="sidebar-name">{{ site.title }}</h1>
    <p class="sidebar-role">{{ site.description }}</p>
  </div>
  {% include section-nav.html %}
  <div class="sidebar-actions">
    {% if site.data.hero.cv_url %}
    <a href="{{ site.data.hero.cv_url }}" class="sidebar-btn sidebar-btn-primary" target="_blank" rel="noopener noreferrer">
      Download CV
    </a>
    {% endif %}
    <a href="#contact" class="sidebar-btn sidebar-btn-outline">Contact Me</a>
  </div>
</aside>
