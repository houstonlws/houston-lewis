<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>{{ page.title }}</title>
    <meta name="description" content="{{ site.seo_description | default: site.description }}" />
    <meta property="og:title" content="{{ page.title }} — {{ site.description }}" />
    <meta property="og:description" content="{{ site.seo_description | default: site.description }}" />
    <meta property="og:url" content="{{ site.url }}{{ site.baseurl }}/" />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary" />
    <meta name="twitter:title" content="{{ page.title }} — {{ site.description }}" />
    <meta name="twitter:description" content="{{ site.seo_description | default: site.description }}" />
    <link
      rel="stylesheet"
      type="text/css"
      href="https://cdn.jsdelivr.net/gh/devicons/devicon@latest/devicon.min.css" />
    <link rel="stylesheet" href="{{ site.baseurl }}/assets/css/styles.css" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&display=swap"
      rel="stylesheet" />
    <link
      rel="icon"
      href="{{ site.baseurl }}/assets/images/branch-logo-white.svg"
      type="image/x-icon" />
    <link
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"
      rel="stylesheet" />
  </head>
  <body>
    <main class="app">
      {% include sidebar.html %}
      <div class="app-content">
        {% include hero.html %}
        {% include stats.html %}
        {% include experience.html %}
        {% include certifications.html %}
        {% include skills.html %}
        {% include portfolio.html %}
        {% include education.html %}
        {% include contact.html %}
        {{ content }}
      </div>
    </main>
    <script src="{{ site.baseurl }}/assets/js/experience.js"></script>
    <script src="{{ site.baseurl }}/assets/js/portfolio.js"></script>
    <script src="{{ site.baseurl }}/assets/js/scroll-reveal.js"></script>
  </body>
</html>
