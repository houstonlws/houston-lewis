title: What I Do
info: I'm a Senior Tech Analyst who helps teams understand how their business systems work — and how to make them work better. At Infosys, I analyze and improve AWS-based logistics and billing platforms — pub/sub messaging pipelines, CI/CD workflows, Terraform-managed infrastructure, and the operational tooling stakeholders rely on. I'm GCP certified, work comfortably across AWS and Google Cloud, and focus on reliable, well-designed systems that hold up in production.
