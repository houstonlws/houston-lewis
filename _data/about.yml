title: What I Do
info: I'm a Senior Tech Analyst and hands-on full stack developer who builds and improves Java/Spring Boot microservices in production. At Infosys, I ship and maintain distributed services for a large enterprise logistics and billing platform — REST APIs, pub/sub messaging, batch processing, and the AWS infrastructure and CI/CD pipelines that support them. I'm GCP certified, work across AWS and Google Cloud, and bring both deep code-level ownership and systems analysis to keep platforms reliable at scale. I'm comfortable incorporating AI-assisted development into my workflow, with deliberate prompt engineering to stay productive without sacrificing quality.
